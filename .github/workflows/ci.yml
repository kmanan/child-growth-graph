name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate CDC data
        run: npm run validate:data

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  docker:
    name: Docker self-host smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build self-host image
        run: docker build -t cdc-growth-charts:ci .

      - name: Start container
        run: docker run -d --name cdc-growth-charts-ci -p 4769:3000 cdc-growth-charts:ci

      - name: Wait for health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4769/ >/tmp/cdc-growth-home.html; then
              exit 0
            fi
            sleep 2
          done
          docker logs cdc-growth-charts-ci
          exit 1

      - name: Verify self-host UI bundle
        run: |
          grep -q "Growth Charts" /tmp/cdc-growth-home.html
          grep -q "No measurements yet" /tmp/cdc-growth-home.html
          css_path=$(grep -o "/_next/static/[^\" ]*\.css" /tmp/cdc-growth-home.html | head -1)
          test -n "$css_path"
          curl -fsSI "http://127.0.0.1:4769${css_path}" | grep -i "content-type: text/css"
