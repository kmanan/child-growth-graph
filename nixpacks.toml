[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
cmds = ["npm install"]

[phases.build]
# Preserve the krytonlabs.com/childgrowth subpath that the prod nginx proxy
# expects. The repo default basePath is empty (root) for OSS self-hosters;
# this Railway-specific build bakes the prod subpath back in.
cmds = ["BASE_PATH=/childgrowth npm run build"]

[start]
cmd = "npm start"